<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro de Usuários</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.95;
        }

        button:active {
            transform: scale(0.98);
        }

        .mensagem {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
        }

        .mensagem.sucesso {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #4ade80;
        }

        .mensagem.erro {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .users-section {
            margin-top: 2.5rem;
            border-top: 1px solid #334155;
            padding-top: 1.5rem;
        }

        .users-section h2 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 1rem;
        }

        .users-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .user-card {
            background: #0f172a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
        }

        .user-card .user-id {
            color: #64748b;
            font-size: 0.75rem;
        }

        .empty-users {
            color: #64748b;
            font-size: 0.875rem;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cadastro de Usuário</h1>
        <p class="subtitle">Exercício de Rota Node.js & Formulário</p>

        <form id="usuarioForm" action="http://localhost:3000/api/usuarios" method="post">
            <div class="form-group">
                <label for="nome">Nome do Usuário:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome..." required>
            </div>

            <button type="submit">Cadastrar Usuário</button>
        </form>

        <div id="mensagem" class="mensagem"></div>

        <div class="users-section">
            <h2>Usuários Cadastrados</h2>
            <ul id="usersList" class="users-list">
                <li class="empty-users">Nenhum usuário cadastrado ainda.</li>
            </ul>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/usuarios';
        const form = document.getElementById('usuarioForm');
        const nomeInput = document.getElementById('nome');
        const mensagemDiv = document.getElementById('mensagem');
        const usersList = document.getElementById('usersList');

        async function carregarUsuarios() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) return;
                const usuarios = await res.json();
                renderizarUsuarios(usuarios);
            } catch (err) {
                console.log('Servidor offline ou sem conexão:', err);
            }
        }

        function renderizarUsuarios(usuarios) {
            if (!Array.isArray(usuarios) || usuarios.length === 0) {
                usersList.innerHTML = '<li class="empty-users">Nenhum usuário cadastrado ainda.</li>';
                return;
            }
            usersList.innerHTML = usuarios.map(u => `
                <li class="user-card">
                    <span><strong>${escapeHtml(u.nome)}</strong></span>
                    <span class="user-id">ID: ${u.id}</span>
                </li>
            `).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = nomeInput.value.trim();
            if (!nome) return;

            mensagemDiv.className = 'mensagem';
            mensagemDiv.style.display = 'none';

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome })
                });

                const data = await res.json();

                if (res.ok) {
                    mensagemDiv.textContent = `Usuário "${data.nome}" cadastrado com sucesso!`;
                    mensagemDiv.className = 'mensagem sucesso';
                    nomeInput.value = '';
                    carregarUsuarios();
                } else {
                    mensagemDiv.textContent = data.erro || 'Erro ao cadastrar.';
                    mensagemDiv.className = 'mensagem erro';
                }
            } catch (err) {
                mensagemDiv.textContent = 'Erro ao se comunicar com o servidor.';
                mensagemDiv.className = 'mensagem erro';
            }
        });

        carregarUsuarios();
    </script>
</body>

</html>
