<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro de Usuários</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Cadastro de Usuário</h1>
        <p class="subtitle">Exercício de Rota Node.js & Formulário</p>

        <form id="usuarioForm" action="http://localhost:3000/api/usuarios" method="post">
            <div class="form-group">
                <label for="nome">Nome do Usuário:</label>
                <input type="text" id="nome" name="nome" placeholder="Nome" required>
            </div>

            <button type="submit">Cadastrar Usuário</button>
        </form>

        <div id="mensagem" class="mensagem"></div>

        <div class="users-section">
            <h2>Usuários Cadastrados</h2>
            <ul id="usersList" class="users-list">
                <li class="empty-users">Nenhum usuário cadastrado ainda.</li>
            </ul>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
